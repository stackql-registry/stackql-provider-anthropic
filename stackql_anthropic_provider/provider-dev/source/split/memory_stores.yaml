          type: string
          minLength: 1
        user_id:
          description: ID of the user (a `user_...` value).
          type: string
          minLength: 1
        service_account_id:
          description: ID of the service account (a `svac_...` value).
          type: string
          minLength: 1
    BetaManagedAgentsMemoryStore:
