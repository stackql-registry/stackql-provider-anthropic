          memory_precondition_failed_error: '#/components/schemas/BetaManagedAgentsMemoryPreconditionFailedError'
          memory_path_conflict_error: '#/components/schemas/BetaManagedAgentsMemoryPathConflictError'
          conflict_error: '#/components/schemas/BetaManagedAgentsConflictError'
      properties:
        message:
          default: Invalid request
          title: Message
          type: string
        type:
          default: invalid_request_error
          title: Type
          type: string
          enum:
            - invalid_request_error
        conflicting_path:
          description: 'The path that blocked the write: the requested path, or the path of a memory that is an ancestor or descendant of it.'
          type: string
        conflicting_memory_id:
          description: |-
            The ID of the memory that blocked the write (`mem_...`), or an empty string if that memory can't be identified.

            Retry the request when it is empty.
          type: string
      required:
        - message
        - type
      title: InvalidRequestError
      type: object
      description: |-
        The error returned with HTTP status 409 when a request's precondition doesn't hold for the memory's current state, such as `precondition` on an update or `expected_content_sha256` on a delete.

        The error doesn't include the memory's current state. Retrieve the memory to see its current content and `content_sha256` before you retry.

        See the [memory guide](https://platform.claude.com/docs/en/managed-agents/memory#safe-content-edits-optimistic-concurrency) to learn more about safe content edits with content hash preconditions.
    BetaManagedAgentsMemoryListItem:
      description: 'One item in a [List memories](/en/api/beta/memory_stores/memories/list) response: either a `memory` object or, when `depth` is set, a `memory_prefix` rollup marker.'
      type: object
      discriminator:
        propertyName: type
        mapping:
          memory: '#/components/schemas/BetaManagedAgentsMemory'
          memory_prefix: '#/components/schemas/BetaManagedAgentsMemoryPrefix'
      required:
        - type
        - id
        - memory_store_id
        - path
        - content_size_bytes
        - content_sha256
        - memory_version_id
        - created_at
        - updated_at
      properties:
        type:
          type: string
          enum:
            - memory
        id:
          description: Unique identifier for this memory (a `mem_...` value). Stable across renames; use this ID, not the path, to read, update, or delete the memory.
          type: string
        memory_store_id:
          description: ID of the memory store this memory belongs to (a `memstore_...` value).
          type: string
        path:
          description: Hierarchical path of the memory within the store, e.g. `/projects/foo/notes.md`. Always starts with `/`. Paths are case-sensitive and unique within a store. Maximum 1,024 bytes.
          type: string
        content:
          description: The memory's UTF-8 text content. Populated when `view=full`; `null` when `view=basic`. Maximum 100 kB (102,400 bytes).
          nullable: true
          type: string
        content_size_bytes:
          description: Size of `content` in bytes (the UTF-8 plaintext length). Always populated, regardless of `view`.
          type: integer
          format: int32
        content_sha256:
          description: Lowercase hex SHA-256 digest of the UTF-8 `content` bytes (64 characters). The server applies no normalization, so clients can compute the same hash locally for staleness checks and as the value for a `content_sha256` precondition on update. Always populated, regardless of `view`.
          type: string
        memory_version_id:
          description: ID of the `memory_version` representing this memory's current content (a `memver_...` value). This is the authoritative head pointer; `memory_version` objects do not carry an `is_latest` flag, so compare against this field instead. Enumerate the history via [List memory versions](/en/api/beta/memory_stores/memory_versions/list).
          type: string
        created_at:
          description: When this memory was created, in RFC 3339 format.
          type: string
          format: date-time
        updated_at:
          description: When this memory was last modified, in RFC 3339 format. Use this as a cheap freshness signal; for who made the change, look up the head version's `created_by` via [List memory versions](/en/api/beta/memory_stores/memory_versions/list).
          type: string
          format: date-time
    BetaManagedAgentsPrecondition:
      description: Optional condition that must hold for an update to apply. When omitted, the update is unconditional. Asserts the current state of the memory being updated. When an update changes `path`, the precondition still refers to the memory's current content, not the destination path. Currently the only supported variant is `content_sha256`.
      type: object
      discriminator:
