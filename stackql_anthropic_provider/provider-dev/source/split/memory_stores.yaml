    BetaManagedAgentsDeletedMemoryStore:
      description: Confirmation that a `memory_store` was deleted.
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum:
            - memory_store_deleted
        id:
          description: ID of the deleted memory store (a `memstore_...` identifier). The store and all its memories and versions are no longer retrievable.
          type: string
    BetaManagedAgentsMemoryPreconditionFailedError:
      description: |-
        The error returned with HTTP status 409 when a request's precondition doesn't hold for the memory's current state, such as `precondition` on an update or `expected_content_sha256` on a delete.

        The error doesn't include the memory's current state. Retrieve the memory to see its current content and `content_sha256` before you retry.

        See the [memory guide](https://platform.claude.com/docs/en/managed-agents/memory#safe-content-edits-optimistic-concurrency) to learn more about safe content edits with content hash preconditions.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - memory_precondition_failed_error
        message:
          description: A human-readable explanation of why the precondition failed.
          type: string
    BetaManagedAgentsMemoryPathConflictError:
      description: |-
        The error returned with HTTP status 409 when a create or rename targets a path that another memory uses, or a path that overlaps another memory's path.

        Two paths overlap when one is an ancestor of the other, such as `/notes` and `/notes/todo.md`. To free the path, rename or delete the memory that `conflicting_memory_id` references, then retry. To change that memory instead of creating a new one, update it.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - memory_path_conflict_error
        message:
          description: A human-readable explanation of the conflict. To handle the error in code, use `conflicting_path` and `conflicting_memory_id` instead.
          type: string
        conflicting_path:
          description: 'The path that blocked the write: the requested path, or the path of a memory that is an ancestor or descendant of it.'
          type: string
        conflicting_memory_id:
          description: |-
            The ID of the memory that blocked the write (`mem_...`), or an empty string if that memory can't be identified.

            Retry the request when it is empty.
          type: string
    BetaManagedAgentsConflictError:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - conflict_error
        message:
          type: string
    BetaManagedAgentsMemoryPrefix:
      description: A rolled-up directory marker returned by [List memories](/en/api/beta/memory_stores/memories/list) when `depth` is set. Indicates that one or more memories exist deeper than the requested depth under this prefix. This is a list-time rollup, not a stored resource; it has no ID and no lifecycle. Each prefix counts toward the page `limit` and interleaves with `memory` items in path order.
      type: object
      required:
        - type
        - path
      properties:
        type:
          type: string
          enum:
            - memory_prefix
        path:
          description: The rolled-up path prefix, including a trailing `/` (e.g. `/projects/foo/`). Pass this value as `path_prefix` on a subsequent list call to drill into the directory.
          type: string
    BetaManagedAgentsContentSha256Precondition:
      description: 'Optimistic-concurrency precondition: the update applies only if the memory''s stored `content_sha256` equals the supplied value. On mismatch, the request returns `memory_precondition_failed_error` (HTTP 409); re-read the memory and retry against the fresh state. If the precondition fails but the stored state already exactly matches the requested `content` and `path`, the server returns 200 instead of 409.'
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - content_sha256
        content_sha256:
          description: Expected `content_sha256` of the stored memory (64 lowercase hexadecimal characters). Typically the `content_sha256` returned by a prior read or list call. Because the server applies no content normalization, clients can also compute this locally as the SHA-256 of the UTF-8 content bytes.
          type: string
    BetaManagedAgentsSessionActor:
      description: An agent acting during a session, for example through the session's mounted filesystem. It names the session itself, not the user or API key that started the session.
      type: object
      required:
        - type
        - session_id
      properties:
        type:
          type: string
          enum:
            - session_actor
        session_id:
          description: ID of the session (a `sesn_...` value). Look up the session via [Retrieve a session](/en/api/beta/sessions/retrieve) for further provenance.
          type: string
          minLength: 1
    BetaManagedAgentsApiActor:
      description: A direct caller of the public API, identified by the API key that authenticated the request.
      type: object
      required:
        - type
        - api_key_id
      properties:
        type:
          type: string
          enum:
            - api_actor
        api_key_id:
          description: ID of the API key (an `apikey_...` value). This identifies the key, not the secret.
          type: string
          minLength: 1
    BetaManagedAgentsUserActor:
      description: A human user, for example acting through the Anthropic Console.
      type: object
      required:
        - type
        - user_id
      properties:
        type:
          type: string
          enum:
            - user_actor
        user_id:
          description: ID of the user (a `user_...` value).
          type: string
          minLength: 1
    BetaManagedAgentsServiceAccountActor:
      description: A workload authenticated as a service account, for example via Workload Identity Federation.
      type: object
