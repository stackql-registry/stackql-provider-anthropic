components:
  schemas:
    BetaManagedAgentsMemoryView:
      type: string
      description: 'Selects which projection of a `memory` or `memory_version` the server returns. `basic` returns the object with `content` set to `null`; `full` populates `content`. When omitted, the default is endpoint-specific: retrieve operations default to `full`; list, create, and update operations default to `basic`. Listing with `view=full` caps `limit` at 20.'
      enum:
        - basic
        - full
      x-enum-descriptions:
        - Return the object with `content` set to `null`. The `content_size_bytes` and `content_sha256` fields remain populated, so sync clients can diff without fetching content.
        - Return the object with `content` populated. On list endpoints, `view=full` caps `limit` at 20.
    BetaManagedAgentsCreateMemoryParams:
      description: 'Request parameters for [Create a memory](/en/api/beta/memory_stores/memories/create). The path must be unoccupied: if a memory already exists at the path, or the path is an ancestor or descendant of an existing memory''s path, the request returns `memory_path_conflict_error` (HTTP 409). Create never overwrites; to modify an existing memory, use [Update a memory](/en/api/beta/memory_stores/memories/update).'
      type: object
      required:
        - path
        - content
      properties:
        path:
          description: Hierarchical path for the new memory, e.g. `/projects/foo/notes.md`. Must start with `/`, contain at least one non-empty segment, and be at most 1,024 bytes. Must not contain empty segments, `.` or `..` segments, control or format characters, or the Unicode line and paragraph separators (U+2028, U+2029), and must be NFC-normalized. Paths are case-sensitive.
          type: string
          minLength: 2
          maxLength: 1024
        content:
          description: UTF-8 text content for the new memory. Maximum 100 kB (102,400 bytes). Required; pass `""` explicitly to create an empty memory.
          nullable: true
          type: string
    BetaManagedAgentsMemory:
      description: 'A `memory` object: a single text document at a hierarchical path inside a memory store. The `content` field is populated when `view=full` and `null` when `view=basic`; the `content_size_bytes` and `content_sha256` fields are always populated so sync clients can diff without fetching content. Memories are addressed by their `mem_...` ID; the path is the create key and can be changed via update.'
      type: object
      required:
        - type
        - id
        - memory_store_id
        - path
        - content_size_bytes
        - content_sha256
        - memory_version_id
        - created_at
        - updated_at
      properties:
        type:
          type: string
          enum:
            - memory
        id:
          description: Unique identifier for this memory (a `mem_...` value). Stable across renames; use this ID, not the path, to read, update, or delete the memory.
          type: string
        memory_store_id:
          description: ID of the memory store this memory belongs to (a `memstore_...` value).
          type: string
        path:
          description: Hierarchical path of the memory within the store, e.g. `/projects/foo/notes.md`. Always starts with `/`. Paths are case-sensitive and unique within a store. Maximum 1,024 bytes.
          type: string
        content:
          description: The memory's UTF-8 text content. Populated when `view=full`; `null` when `view=basic`. Maximum 100 kB (102,400 bytes).
          nullable: true
          type: string
        content_size_bytes:
          description: Size of `content` in bytes (the UTF-8 plaintext length). Always populated, regardless of `view`.
          type: integer
          format: int32
        content_sha256:
          description: Lowercase hex SHA-256 digest of the UTF-8 `content` bytes (64 characters). The server applies no normalization, so clients can compute the same hash locally for staleness checks and as the value for a `content_sha256` precondition on update. Always populated, regardless of `view`.
          type: string
        memory_version_id:
          description: ID of the `memory_version` representing this memory's current content (a `memver_...` value). This is the authoritative head pointer; `memory_version` objects do not carry an `is_latest` flag, so compare against this field instead. Enumerate the history via [List memory versions](/en/api/beta/memory_stores/memory_versions/list).
          type: string
        created_at:
          description: When this memory was created, in RFC 3339 format.
          type: string
          format: date-time
        updated_at:
          description: When this memory was last modified, in RFC 3339 format. Use this as a cheap freshness signal; for who made the change, look up the head version's `created_by` via [List memory versions](/en/api/beta/memory_stores/memory_versions/list).
          type: string
          format: date-time
    BetaManagedAgentsErrorResponse:
      type: object
      required:
        - type
        - error
      properties:
        type:
          type: string
          enum:
            - error
          description: Always "error" for error responses
        error:
          $ref: '#/components/schemas/BetaManagedAgentsError'
        request_id:
          default: null
          title: Request Id
          nullable: true
          type: string
    BetaManagedAgentsListMemoriesResult:
      description: Response payload for [List memories](/en/api/beta/memory_stores/memories/list).
      type: object
      properties:
        data:
          description: One page of results. Each item is either a `memory` object or, when `depth` was set, a `memory_prefix` rollup marker. Items are returned in a stable, server-defined order.
          type: array
          items:
            $ref: '#/components/schemas/BetaManagedAgentsMemoryListItem'
        next_page:
          description: Opaque cursor for the next page (a `page_...` value), or `null` if there are no more results. Pass as `page` on the next request.
          nullable: true
          type: string
    BetaManagedAgentsUpdateMemoryParams:
      description: 'Request parameters for [Update a memory](/en/api/beta/memory_stores/memories/update). At least one of `content` or `path` must be provided. Renaming onto a path occupied by a different memory returns `memory_path_conflict_error` (HTTP 409). Rename never overwrites; delete or rename the blocking memory first. An update where every supplied field already matches the stored value is a no-op: it returns 200 with the existing memory and writes no new version.'
      type: object
      properties:
        content:
          description: New UTF-8 text content for the memory. Maximum 100 kB (102,400 bytes). Omit to leave the content unchanged (e.g., for a rename-only update).
          nullable: true
          type: string
        path:
          description: New path for the memory (a rename). Must start with `/`, contain at least one non-empty segment, and be at most 1,024 bytes. Must not contain empty segments, `.` or `..` segments, control or format characters, or the Unicode line and paragraph separators (U+2028, U+2029), and must be NFC-normalized. Paths are case-sensitive. The memory's `id` is preserved across renames. Omit to leave the path unchanged.
          nullable: true
          type: string
          minLength: 2
          maxLength: 1024
        precondition:
          description: Optional optimistic-concurrency precondition. When supplied, the update applies only if the memory's current state matches; on mismatch the request returns `memory_precondition_failed_error` (HTTP 409). When omitted, the update is unconditional.
          type: object
          discriminator:
            propertyName: type
            mapping:
              content_sha256: '#/components/schemas/BetaManagedAgentsContentSha256Precondition'
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - content_sha256
            content_sha256:
              description: Expected `content_sha256` of the stored memory (64 lowercase hexadecimal characters). Typically the `content_sha256` returned by a prior read or list call. Because the server applies no content normalization, clients can also compute this locally as the SHA-256 of the UTF-8 content bytes.
              type: string
    BetaManagedAgentsDeletedMemory:
      description: 'Tombstone returned by [Delete a memory](/en/api/beta/memory_stores/memories/delete). Deleting a memory does not erase its version history: its versions remain listable via [List memory versions](/en/api/beta/memory_stores/memory_versions/list) while they are retained (each version is kept for at least the version retention period after it was written, unless the store itself is deleted).'
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum:
            - memory_deleted
        id:
          description: ID of the deleted memory (a `mem_...` value).
          type: string
    BetaManagedAgentsMemoryVersionOperation:
      type: string
      description: The kind of mutation a `memory_version` records. Every non-no-op mutation to a memory appends exactly one version row with one of these values.
      enum:
        - created
        - modified
        - deleted
      x-enum-descriptions:
        - The memory was created. The first version in any memory's lineage.
        - The memory's `content`, `path`, or both were changed via update. Writes the agent makes through the filesystem mount also appear as `modified`.
        - The memory was deleted. The `content`, `content_size_bytes`, and `content_sha256` fields are `null` on this version. The preceding version, while it is retained, records the deleted content's size and hash.
    BetaTimestamp:
      description: A timestamp in RFC 3339 format
      type: string
      format: date-time
    BetaManagedAgentsListMemoryVersionsResult:
      description: Response payload for [List memory versions](/en/api/beta/memory_stores/memory_versions/list).
      type: object
      properties:
        data:
          description: One page of `memory_version` objects, ordered by `created_at` descending (newest first), with `id` as tiebreak.
          type: array
          items:
            $ref: '#/components/schemas/BetaManagedAgentsMemoryVersion'
        next_page:
          description: Opaque cursor for the next page (a `page_...` value), or `null` if there are no more results. Pass as `page` on the next request.
          nullable: true
          type: string
    BetaManagedAgentsMemoryVersion:
      description: 'A `memory_version` object: one immutable, attributed row in a memory''s append-only history. Every non-no-op mutation to a memory produces a new version. Versions belong to the store (not the individual memory) and are not deleted with the memory; each version is retained for at least the version retention period after it was written, unless the store itself is deleted. Retrieving a redacted version returns 200 with `content`, `path`, `content_size_bytes`, and `content_sha256` set to `null`; branch on `redacted_at`, not HTTP status.'
      type: object
      required:
        - type
        - id
        - memory_store_id
        - memory_id
        - operation
        - created_at
      properties:
        type:
          type: string
          enum:
            - memory_version
        id:
          description: Unique identifier for this version (a `memver_...` value).
          type: string
        memory_store_id:
          description: ID of the memory store this version belongs to (a `memstore_...` value).
          type: string
        memory_id:
          description: ID of the memory this version snapshots (a `mem_...` value). Remains valid after the memory is deleted; pass it as `memory_id` to [List memory versions](/en/api/beta/memory_stores/memory_versions/list) to retrieve the memory's retained versions, including the `deleted` row while the lineage is retained.
          type: string
        path:
          description: The memory's path at the time of this write. `null` if and only if `redacted_at` is set.
          nullable: true
          type: string
        operation:
          description: 'The kind of mutation this version records: `created`, `modified`, or `deleted`.'
          type: string
          enum:
            - created
            - modified
            - deleted
          x-enum-descriptions:
            - The memory was created. The first version in any memory's lineage.
            - The memory's `content`, `path`, or both were changed via update. Writes the agent makes through the filesystem mount also appear as `modified`.
            - The memory was deleted. The `content`, `content_size_bytes`, and `content_sha256` fields are `null` on this version. The preceding version, while it is retained, records the deleted content's size and hash.
        content:
          description: The memory's UTF-8 text content as of this version. `null` when `view=basic`, when `operation` is `deleted`, or when `redacted_at` is set.
          nullable: true
          type: string
        content_size_bytes:
          description: Size of `content` in bytes as of this version. `null` when `redacted_at` is set or `operation` is `deleted`. Populated regardless of `view` otherwise.
          nullable: true
          type: integer
          format: int32
        content_sha256:
          description: Lowercase hex SHA-256 digest of `content` as of this version (64 characters). `null` when `redacted_at` is set or `operation` is `deleted`. Populated regardless of `view` otherwise.
          nullable: true
          type: string
        created_by:
          description: 'Who performed this write: one of `session_actor`, `api_actor`, `user_actor`, or `service_account_actor`; `null` when no writer is recorded. Captured at write time and preserved through redaction. A `session_actor` is an agent writing through the store''s mounted filesystem at `/mnt/memory/`. The API key that created that session is not recorded on agent writes, so attribution names who made the write, not who is ultimately responsible; look up session provenance via the [Sessions API](/en/api/beta/sessions/retrieve).'
          type: object
          discriminator:
            propertyName: type
            mapping:
              session_actor: '#/components/schemas/BetaManagedAgentsSessionActor'
              api_actor: '#/components/schemas/BetaManagedAgentsApiActor'
              user_actor: '#/components/schemas/BetaManagedAgentsUserActor'
              service_account_actor: '#/components/schemas/BetaManagedAgentsServiceAccountActor'
          required:
            - type
            - session_id
            - api_key_id
            - user_id
            - service_account_id
          properties:
            type:
              type: string
              enum:
                - session_actor
            session_id:
              description: ID of the session (a `sesn_...` value). Look up the session via [Retrieve a session](/en/api/beta/sessions/retrieve) for further provenance.
              type: string
              minLength: 1
            api_key_id:
              description: ID of the API key (an `apikey_...` value). This identifies the key, not the secret.
              type: string
              minLength: 1
            user_id:
              description: ID of the user (a `user_...` value).
              type: string
              minLength: 1
            service_account_id:
              description: ID of the service account (a `svac_...` value).
              type: string
              minLength: 1
        created_at:
          description: When this version was written, in RFC 3339 format.
          type: string
          format: date-time
        redacted_at:
          description: When this version was redacted, in RFC 3339 format, or `null` if it has not been redacted. When set, `content`, `path`, `content_size_bytes`, and `content_sha256` are all `null`. See [Redact a memory version](/en/api/beta/memory_stores/memory_versions/redact).
          nullable: true
          type: string
          format: date-time
        redacted_by:
          description: Who redacted this version, or `null` if it has not been redacted. In practice always an `api_actor`, `user_actor`, or `service_account_actor` (agents do not have a redact capability).
          type: object
          discriminator:
            propertyName: type
            mapping:
              session_actor: '#/components/schemas/BetaManagedAgentsSessionActor'
              api_actor: '#/components/schemas/BetaManagedAgentsApiActor'
              user_actor: '#/components/schemas/BetaManagedAgentsUserActor'
              service_account_actor: '#/components/schemas/BetaManagedAgentsServiceAccountActor'
          required:
            - type
            - session_id
            - api_key_id
            - user_id
            - service_account_id
          properties:
            type:
              type: string
              enum:
                - session_actor
            session_id:
              description: ID of the session (a `sesn_...` value). Look up the session via [Retrieve a session](/en/api/beta/sessions/retrieve) for further provenance.
              type: string
              minLength: 1
            api_key_id:
              description: ID of the API key (an `apikey_...` value). This identifies the key, not the secret.
              type: string
              minLength: 1
            user_id:
              description: ID of the user (a `user_...` value).
              type: string
              minLength: 1
            service_account_id:
              description: ID of the service account (a `svac_...` value).
              type: string
              minLength: 1
    BetaManagedAgentsCreateMemoryStoreRequest:
      description: Request parameters for creating a `memory_store`.
      type: object
      required:
        - name
      properties:
        name:
          description: Human-readable name for the store. Required; 1–255 characters; no control characters. The mount-path slug under `/mnt/memory/` is derived from this name (lowercased, non-alphanumeric runs collapsed to a hyphen). Names need not be unique within a workspace.
          type: string
          minLength: 1
          maxLength: 255
        description:
          description: Free-text description of what the store contains, up to 1024 characters. Included in the agent's system prompt when the store is attached, so word it to be useful to the agent.
          type: string
          maxLength: 1024
        metadata:
          description: Arbitrary key-value tags for your own bookkeeping (such as the end user a store belongs to). Up to 16 pairs; keys 1–64 characters; values up to 512 characters. Not visible to the agent.
          type: object
