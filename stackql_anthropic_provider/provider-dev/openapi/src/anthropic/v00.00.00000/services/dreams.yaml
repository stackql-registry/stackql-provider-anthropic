            x-stainless-extend-default: true
            description: Optional header to specify the beta version(s) you want to use.
            default: dreaming-2026-04-21
        - name: anthropic-workspace-id
          in: header
          required: false
          schema:
            type: string
            x-stainless-param: workspace_id
          description: |-
            Optional header to select the Workspace for this request. The value is a Workspace ID (for example, `wrkspc_011CZkZaBF1tNoB5wlCeusgy`).

            Only needed for credentials that can act on more than one Workspace. A credential that belongs to a specific Workspace may omit it; if sent, it must match that Workspace.
          example: wrkspc_011CZkZaBF1tNoB5wlCeusgy
    get:
      operationId: BetaListDreams
      summary: List Dreams
      description: |-
        List the dreams in the workspace, newest first.

        Archived dreams are left out unless `include_archived` is `true`.

        See the [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#list-dreams) for how to page through dreams.
      parameters:
        - name: x-api-key
          in: header
          required: false
          schema:
            type: string
        - name: anthropic-version
          in: header
          required: false
          schema:
            type: string
            default: "2023-06-01"
        - name: anthropic-beta
          in: header
          required: false
          schema:
            type: array
            x-stainless-param: betas
            x-stainless-extend-default: true
            description: Optional header to specify the beta version(s) you want to use.
            default: dreaming-2026-04-21
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
          description: The maximum number of dreams to return, from 1 to 100. Defaults to 20.
        - name: page
          in: query
          required: false
          schema:
            type: string
          description: |-
            The cursor for the page to return, taken from `next_page` in a previous response.

            Leave it out to get the first page.
        - name: include_archived
          in: query
          required: false
          schema:
            type: boolean
          description: Whether to include archived dreams. Defaults to `false`.
        - name: statuses[]
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/BetaDreamStatus"
          description: |-
            Return only dreams that have one of these statuses.

            Repeat the parameter to give more than one status. Leave it out to return dreams of every status.
        - name: created_at[gt]
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BetaTimestamp"
          description: Return only dreams created after this time (exclusive), in RFC 3339.
        - name: created_at[lt]
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BetaTimestamp"
          description: Return only dreams created before this time (exclusive), in RFC 3339.
        - name: anthropic-workspace-id
          in: header
          required: false
          schema:
            type: string
            x-stainless-param: workspace_id
          description: |-
            Optional header to select the Workspace for this request. The value is a Workspace ID (for example, `wrkspc_011CZkZaBF1tNoB5wlCeusgy`).

            Only needed for credentials that can act on more than one Workspace. A credential that belongs to a specific Workspace may omit it; if sent, it must match that Workspace.
          example: wrkspc_011CZkZaBF1tNoB5wlCeusgy
