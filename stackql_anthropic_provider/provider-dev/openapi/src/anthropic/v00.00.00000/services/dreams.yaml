  /v1/dreams/{dream_id}/archive?beta=true:
    post:
      operationId: BetaArchiveDream
      summary: Archive a Dream
      description: |-
        Hide a `completed`, `failed`, or `canceled` dream from the default list of dreams.

        Archiving a `pending` or `running` dream returns a 400 error, so cancel it first. Archiving an archived dream returns it unchanged. An archived dream can still be fetched by ID. Archiving can't be undone.

        See the [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#archive-a-dream) to learn more about archiving dreams.
      parameters:
        - name: anthropic-version
          in: header
          required: false
          schema:
            type: string
            default: "2023-06-01"
        - name: anthropic-beta
          in: header
          required: false
          schema:
            type: array
            x-stainless-param: betas
            x-stainless-extend-default: true
            description: Optional header to specify the beta version(s) you want to use.
            default: dreaming-2026-04-21
        - name: dream_id
          in: path
          required: true
          schema:
            type: string
            x-stainless-cli-data-alias: id
          description: The ID of the dream to archive (`drm_...`).
        - name: anthropic-workspace-id
          in: header
          required: false
          schema:
            type: string
            x-stainless-param: workspace_id
          description: |-
            Optional header to select the Workspace for this request. The value is a Workspace ID (for example, `wrkspc_011CZkZaBF1tNoB5wlCeusgy`).

