  /v1/dreams/{dream_id}/cancel?beta=true:
    post:
      operationId: BetaCancelDream
      summary: Cancel a Dream
      description: |-
        Stop a `pending` or `running` dream.

        The response shows `status` as `canceled`, unless the dream reached `completed` or `failed` first. `usage` can keep changing after the response. Canceling a `canceled` dream returns it unchanged. Canceling a `completed` or `failed` dream returns a 400 error.

        See the [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#cancel-a-dream) to learn more about canceling dreams.
      parameters:
        - name: anthropic-version
          in: header
          required: false
          schema:
            type: string
            default: "2023-06-01"
        - name: anthropic-beta
          in: header
          required: false
          schema:
            type: array
            x-stainless-param: betas
            x-stainless-extend-default: true
            description: Optional header to specify the beta version(s) you want to use.
            default: dreaming-2026-04-21
        - name: dream_id
          in: path
          required: true
          schema:
            type: string
            x-stainless-cli-data-alias: id
          description: The ID of the dream to cancel (`drm_...`).
        - name: anthropic-workspace-id
          in: header
          required: false
          schema:
            type: string
            x-stainless-param: workspace_id
          description: |-
            Optional header to select the Workspace for this request. The value is a Workspace ID (for example, `wrkspc_011CZkZaBF1tNoB5wlCeusgy`).

