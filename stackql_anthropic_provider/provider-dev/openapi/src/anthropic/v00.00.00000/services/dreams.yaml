openapi: 3.0.3
info:
  title: dreams API
  description: anthropic dreams API
  version: 1.0.0
paths:
  /v1/dreams?beta=true:
    post:
      operationId: BetaCreateDream
      summary: Create a Dream
      description: |-
        Start an asynchronous job that uses past sessions to produce a reorganized version of a memory store and get back the dream to poll for the result.

        By default the dream writes its result to a new memory store and doesn't change the input memory store. The response has `status` set to `pending` and an empty `outputs` array. Poll the dream until `status` is `completed`, `failed`, or `canceled`.

        See the [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#create-a-dream) to learn more about creating dreams.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetaCreateDreamRequest"
      responses:
        "200":
          description: Successful response (OK)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaDream"
        "400":
          description: Invalid argument - The client specified an invalid argument
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaDreamingErrorResponse"
        "401":
          description: Unauthenticated - The request does not have valid authentication credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaDreamingErrorResponse"
        "403":
          description: Permission denied - The caller does not have permission to execute the specified operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaDreamingErrorResponse"
        "404":
          description: Not found - Some requested entity was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaDreamingErrorResponse"
        "408":
          description: Deadline exceeded - The deadline expired before the operation could complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaDreamingErrorResponse"
        "409":
          description: Custom error status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaDreamingErrorResponse"
        "412":
          description: Failed precondition - Operation was rejected because the system is not in required state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaDreamingErrorResponse"
        "413":
          description: Out of range - Operation was attempted past the valid range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaDreamingErrorResponse"
        "429":
