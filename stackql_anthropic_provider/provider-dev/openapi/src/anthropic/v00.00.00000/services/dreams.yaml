components:
  schemas:
    BetaCreateDreamRequest:
      type: object
      required:
        - inputs
        - model
      properties:
        inputs:
          description: The memory store and sessions for the dream to read, as exactly one `memory_store` entry and exactly one `sessions` entry.
          type: array
          items:
            $ref: "#/components/schemas/BetaDreamInput"
        model:
          $ref: "#/components/schemas/BetaDreamModelParams"
        instructions:
          description: |-
            Guidance that steers how the dream reads the sessions and organizes the output memory store, from 1 to 4,096 characters.

            See the [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#steer-with-instructions) for what kinds of instructions work well.
          nullable: true
          type: string
          minLength: 1
          maxLength: 4096
        output_behavior:
          $ref: "#/components/schemas/BetaOutputBehavior"
    BetaDream:
      description: |-
        An asynchronous job that reads a memory store and past sessions, then writes a reorganized version of that memory store.

        By default the dream writes its result to a new memory store and doesn't change the input memory store. With `output_behavior` set to `update_existing`, it writes its result into the input memory store instead.

        The Dreams API is in research preview: the request and response shapes are volatile and may change without the deprecation period that applies to generally-available endpoints.

        See the [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#how-it-works) for what a dream reads and produces.
      type: object
      required:
        - type
        - id
        - inputs
        - outputs
        - status
        - created_at
        - ended_at
        - archived_at
        - error
        - model
        - instructions
        - session_id
        - usage
        - output_behavior
      properties:
        type:
          type: string
          enum:
            - dream
        id:
          description: The unique ID of the dream (`drm_...`).
          type: string
        inputs:
          description: The sources that the dream reads, from the request that created it.
          type: array
          items:
            $ref: "#/components/schemas/BetaDreamInput"
        outputs:
          description: |-
            The memory store that holds the dream's result, as a one-item array, or an empty array until the dream records that memory store.

            The array is empty while the dream is `pending` and for a short time after it starts `running`. It can stay empty if the dream fails or is canceled before then. The memory store holds the complete result only once `status` is `completed`.

            See the [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#use-the-output) for how to review and use the result.
          type: array
          items:
            $ref: "#/components/schemas/BetaDreamOutput"
        status:
          $ref: "#/components/schemas/BetaDreamStatus"
        created_at:
          description: |-
            When the dream was created, in RFC 3339.

            Lists of dreams are sorted by this time, newest first.
          type: string
          format: date-time
        ended_at:
          description: When the dream reached `completed`, `failed`, or `canceled`, in RFC 3339, or `null` if it is still `pending` or `running`.
          nullable: true
          type: string
          format: date-time
        archived_at:
          description: When the dream was archived, in RFC 3339, or `null` if it hasn't been archived.
          nullable: true
          type: string
          format: date-time
        error:
          description: Why the dream failed, or `null` if `status` isn't `failed`.
          nullable: true
          type: object
          required:
            - type
            - message
          properties:
            type:
              description: |-
                A code for why the dream failed, such as `timeout` or `internal_error`.

                The [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#errors) lists common error codes and when they occur.
              type: string
            message:
              description: A human-readable explanation of why the dream failed.
              type: string
        model:
          $ref: "#/components/schemas/BetaDreamModelConfig"
        instructions:
          description: The guidance given when the dream was created, or `null` if none was given.
          nullable: true
          type: string
        session_id:
          description: |-
            The ID of the session that runs the dream (`sesn_...`), or `null` if that session hasn't started.

            Stream that session's events to follow what the dream reads and writes.

            See the [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#watch-the-pipeline-run) for how to watch a running dream.
          nullable: true
          type: string
        usage:
          description: The dream's token counts, which stop changing once its `status` is `completed` or `failed`. After a cancel, they can keep changing.
          type: object
          required:
            - input_tokens
            - output_tokens
            - cache_read_input_tokens
            - cache_creation_input_tokens
          properties:
            input_tokens:
              description: The dream's input tokens that weren't read from or written to the prompt cache.
              type: integer
              format: int32
            output_tokens:
              description: The tokens that the model generated for the dream.
              type: integer
              format: int32
            cache_read_input_tokens:
              description: The dream's input tokens that were read from the prompt cache.
              type: integer
              format: int32
            cache_creation_input_tokens:
              description: The dream's input tokens that were written to the prompt cache, for both the 5-minute and 1-hour cache durations.
              type: integer
              format: int32
        output_behavior:
          description: Where the dream writes its result, as set in the request that created the dream. If that request left out `output_behavior`, the dream used the `create_new` behavior.
          type: object
          discriminator:
            propertyName: type
            mapping:
              create_new: "#/components/schemas/BetaOutputBehaviorCreateNew"
              update_existing: "#/components/schemas/BetaOutputBehaviorUpdateExisting"
          required:
            - type
            - memory_store_id
          properties:
            type:
              type: string
              enum:
                - create_new
            memory_store_id:
              description: The ID of the memory store for the dream to write its result to (`memstore_...`). It must be the memory store in the `memory_store` entry of `inputs`.
              type: string
              minLength: 1
    BetaDreamingErrorResponse:
      type: object
      required:
        - type
        - error
      properties:
        type:
          type: string
          description: Always "error" for error responses
          enum:
            - error
        error:
          $ref: "#/components/schemas/BetaDreamingError"
        request_id:
          default: null
          title: Request Id
          nullable: true
          type: string
    BetaDreamStatus:
      type: string
      description: |-
        Where a dream is in its lifecycle.

        `completed`, `failed`, and `canceled` are final: once a dream has one of these statuses, its status doesn't change again.

        See the [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#lifecycle) for what each status means.
      enum:
        - pending
        - running
        - completed
        - failed
        - canceled
      x-enum-descriptions:
        - |-
          The dream is waiting to start and hasn't read its inputs yet.

          `outputs` is empty and every `usage` count is zero.
        - |-
          The dream is reading its inputs and writing its result.

          `usage` updates while the dream has this status.
        - The dream finished and its output memory store holds the complete result.
        - |-
          The dream stopped with an error, which `error` describes.

          If `outputs` references a memory store, that memory store keeps what the dream wrote before it stopped.
        - |-
          A cancel request stopped the dream before it reached `completed` or `failed`.

          If `outputs` references a memory store, that memory store keeps what the dream wrote. `usage` can keep changing after the cancel.
    BetaTimestamp:
      description: A timestamp in RFC 3339 format
      type: string
      format: date-time
    BetaListDreamsResponse:
      description: A page of dreams, newest first.
      type: object
      required:
        - data
        - next_page
      properties:
        data:
          description: The dreams on this page, newest first.
          type: array
          items:
            $ref: "#/components/schemas/BetaDream"
        next_page:
          description: |-
            The cursor for the next page, or `null` if this is the last page.

            Pass it as `page` to get the next page.
          nullable: true
          type: string
    BetaDreamInput:
      description: A source that a dream reads, such as a memory store or a set of sessions.
      type: object
      discriminator:
        propertyName: type
        mapping:
          memory_store: "#/components/schemas/BetaDreamMemoryStoreInput"
          sessions: "#/components/schemas/BetaDreamSessionsInput"
      required:
        - type
        - memory_store_id
        - session_ids
      properties:
        type:
          type: string
          enum:
            - memory_store
        memory_store_id:
          description: |-
            The ID of the memory store for the dream to read (`memstore_...`).

            The memory store must be in the same workspace as the dream and must not be archived.
          type: string
          minLength: 1
        session_ids:
          description: |-
            The IDs of the sessions whose transcripts the dream reads (`sesn_...`).

            Give 1 to 100 IDs, with no duplicates. Each session must be in the same workspace as the dream. Responses list the IDs in sorted order.

            The [limits table in the Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#limits) lists all the limits on a dream.
          type: array
          items:
            type: string
    BetaDreamModelParams:
      description: |-
        The model that runs a dream, given as a model ID or as an object with `id` and `speed`.

        In the object form, `speed` can only be `standard`.

        The [limits table in the Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#limits) lists the supported models.
      type: string
      required:
        - id
      properties:
        id:
          description: |-
            The ID of the model to run the dream with.

            The ID can be 1 to 256 characters long.

            The [limits table in the Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#limits) lists the supported models.
          type: string
          minLength: 1
          maxLength: 256
        speed:
          description: |-
            How fast the model generates output for the dream. Defaults to `standard`.

            Dreams accept only `standard`.
          nullable: true
          type: string
          enum:
            - standard
            - fast
    BetaOutputBehavior:
      description: Which memory store a dream writes its result to. Defaults to `create_new` when left out of a create request.
      type: object
      discriminator:
        propertyName: type
        mapping:
          create_new: "#/components/schemas/BetaOutputBehaviorCreateNew"
          update_existing: "#/components/schemas/BetaOutputBehaviorUpdateExisting"
      required:
        - type
        - memory_store_id
      properties:
        type:
          type: string
          enum:
            - create_new
        memory_store_id:
          description: The ID of the memory store for the dream to write its result to (`memstore_...`). It must be the memory store in the `memory_store` entry of `inputs`.
          type: string
          minLength: 1
    BetaDreamOutput:
      description: An entry in a dream's `outputs` that references the memory store holding its result.
      type: object
      discriminator:
        propertyName: type
        mapping:
          memory_store: "#/components/schemas/BetaDreamMemoryStoreOutput"
      required:
        - type
        - memory_store_id
      properties:
        type:
          type: string
          enum:
            - memory_store
        memory_store_id:
          description: |-
            The ID of the memory store that the dream writes its result to (`memstore_...`).

            With `output_behavior` set to `create_new`, this is a new memory store. With `update_existing`, it is the input memory store.
          type: string
    BetaDreamError:
      description: Failure detail for a Dream whose `status` is `failed`.
      type: object
      required:
        - type
        - message
      properties:
        type:
          description: |-
            A code for why the dream failed, such as `timeout` or `internal_error`.

            The [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#errors) lists common error codes and when they occur.
          type: string
        message:
          description: A human-readable explanation of why the dream failed.
          type: string
    BetaDreamModelConfig:
      description: |-
        The model that runs a dream, from the request that created it.

        The dream uses this model for all of its work. The response always gives the model as an object, even if the request gave only a model ID.
      type: object
      required:
        - id
      properties:
        id:
          description: The ID of the model that runs the dream, as given in the request that created it.
          type: string
          minLength: 1
          maxLength: 256
        speed:
          description: How fast the model generates output for the dream. Always `standard`.
          x-anthropic-beta-required:
            - managed-agents-2026-04-01
            - fast-mode-2026-02-01
          type: string
          enum:
            - standard
            - fast
    BetaDreamUsage:
      description: |-
        The tokens that a dream has used so far.

        The counts are zero while the dream is `pending` and update while it is `running`. They can keep changing after a cancel.

        See the [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#billing) for how dreams are billed. See the [prompt caching guide](https://platform.claude.com/docs/en/build-with-claude/prompt-caching#tracking-cache-performance) for how the input token counts add up.
      type: object
      required:
        - input_tokens
        - output_tokens
        - cache_read_input_tokens
        - cache_creation_input_tokens
      properties:
        input_tokens:
          description: The dream's input tokens that weren't read from or written to the prompt cache.
          type: integer
          format: int32
        output_tokens:
          description: The tokens that the model generated for the dream.
          type: integer
          format: int32
        cache_read_input_tokens:
          description: The dream's input tokens that were read from the prompt cache.
          type: integer
          format: int32
        cache_creation_input_tokens:
          description: The dream's input tokens that were written to the prompt cache, for both the 5-minute and 1-hour cache durations.
          type: integer
          format: int32
    BetaDreamingError:
      discriminator:
        propertyName: type
        mapping:
          invalid_request_error: "#/components/schemas/BetaInvalidRequestError"
          authentication_error: "#/components/schemas/BetaAuthenticationError"
          billing_error: "#/components/schemas/BetaBillingError"
          permission_error: "#/components/schemas/BetaPermissionError"
          not_found_error: "#/components/schemas/BetaNotFoundError"
          rate_limit_error: "#/components/schemas/BetaRateLimitError"
          timeout_error: "#/components/schemas/BetaGatewayTimeoutError"
          api_error: "#/components/schemas/BetaAPIError"
          overloaded_error: "#/components/schemas/BetaOverloadedError"
          conflict_error: "#/components/schemas/BetaTargetStoreHeldError"
      properties:
        message:
          default: Invalid request
          title: Message
          type: string
        type:
          default: invalid_request_error
          title: Type
          type: string
          enum:
            - invalid_request_error
      required:
        - message
        - type
      title: InvalidRequestError
      type: object
      description: |-
        Returned with status 409 when a request to create a dream sets `output_behavior` to `update_existing` and another dream that writes into the same memory store hasn't fully stopped.

        The other dream is `pending` or `running`, or it has just stopped and is still finishing its last writes. `message` gives the ID of the other dream when the server can identify it. If that dream has already reached `completed`, `failed`, or `canceled`, retry after a short wait. Otherwise, wait for the other dream to end or cancel it, then retry. The response sets the `x-should-retry` header to `false`.
    BetaDreamMemoryStoreInput:
      description: |-
        The memory store that a dream reads, given as an entry in `inputs`.

        With `output_behavior` set to `update_existing`, the dream writes its result into this memory store. Otherwise the dream doesn't change it.
      type: object
      required:
        - type
        - memory_store_id
      properties:
        type:
          type: string
          enum:
            - memory_store
        memory_store_id:
          description: |-
            The ID of the memory store for the dream to read (`memstore_...`).

            The memory store must be in the same workspace as the dream and must not be archived.
          type: string
          minLength: 1
    BetaDreamSessionsInput:
      description: The sessions that a dream reads, given as an entry in `inputs`.
      type: object
      required:
        - type
        - session_ids
      properties:
        type:
          type: string
          enum:
            - sessions
        session_ids:
          description: |-
            The IDs of the sessions whose transcripts the dream reads (`sesn_...`).

            Give 1 to 100 IDs, with no duplicates. Each session must be in the same workspace as the dream. Responses list the IDs in sorted order.

            The [limits table in the Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#limits) lists all the limits on a dream.
          type: array
          items:
            type: string
    BetaDreamModelConfigParams:
      description: The object form of `model` in a request to create a dream.
      type: object
      required:
        - id
      properties:
        id:
          description: |-
            The ID of the model to run the dream with.

            The ID can be 1 to 256 characters long.

            The [limits table in the Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#limits) lists the supported models.
          type: string
          minLength: 1
          maxLength: 256
        speed:
          description: |-
            How fast the model generates output for the dream. Defaults to `standard`.

            Dreams accept only `standard`.
          nullable: true
          type: string
          enum:
            - standard
            - fast
    BetaOutputBehaviorCreateNew:
      description: |-
        Write the result to a new memory store that starts as a copy of the input memory store. This is the default.

        The new memory store is in the same workspace as the dream. The dream doesn't change the input memory store.
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - create_new
    BetaOutputBehaviorUpdateExisting:
      description: |-
        Write the result into the input memory store instead of a new memory store.

        The credential must be allowed to write memory stores, or the request returns a 403 error. While another `update_existing` dream on the same memory store hasn't fully stopped, the request returns a 409 error.
      type: object
      required:
        - type
        - memory_store_id
      properties:
        type:
          type: string
          enum:
            - update_existing
        memory_store_id:
          description: The ID of the memory store for the dream to write its result to (`memstore_...`). It must be the memory store in the `memory_store` entry of `inputs`.
          type: string
          minLength: 1
    BetaDreamMemoryStoreOutput:
      description: The memory store that holds a dream's result, as an entry in `outputs`.
      type: object
      required:
        - type
        - memory_store_id
      properties:
        type:
          type: string
          enum:
            - memory_store
        memory_store_id:
          description: |-
            The ID of the memory store that the dream writes its result to (`memstore_...`).

            With `output_behavior` set to `create_new`, this is a new memory store. With `update_existing`, it is the input memory store.
          type: string
    BetaSpeed:
      type: string
      description: Inference speed mode. `fast` provides significantly faster output token generation at premium pricing. Not all models support `fast`; invalid combinations are rejected at create time.
      enum:
