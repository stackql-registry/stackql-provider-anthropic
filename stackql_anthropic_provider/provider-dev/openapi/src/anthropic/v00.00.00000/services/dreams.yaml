          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaDreamingErrorResponse"
        "431":
          description: Request header fields too large - Request metadata was too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaDreamingErrorResponse"
        "499":
          description: Cancelled - The operation was cancelled by the client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaDreamingErrorResponse"
        "500":
