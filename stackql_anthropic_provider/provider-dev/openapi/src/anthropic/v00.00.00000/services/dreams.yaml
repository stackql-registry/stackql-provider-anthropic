            default: dreaming-2026-04-21
        - name: dream_id
          in: path
          required: true
          schema:
            type: string
            x-stainless-cli-data-alias: id
          description: The ID of the dream to get (`drm_...`).
        - name: anthropic-workspace-id
          in: header
