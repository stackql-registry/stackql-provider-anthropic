# Documented exclusion list for the `anthropic` provider.
#
# CI guard 1 (spec-coverage diff) asserts:
#   official spec ops  -  provider ops  ==  EXACTLY this list.
#
# Keys are "<METHOD> <path>" using the spec's literal path keys (beta paths
# carry the pre-baked `?beta=true` suffix). Each entry says why it is out.

sse_streams:
  # Server-sent-event streams are not SQL result sets.
  - op: GET /v1/sessions/{session_id}/events/stream?beta=true
    reason: SSE stream endpoint
  - op: GET /v1/sessions/{session_id}/threads/{thread_id}/stream?beta=true
    reason: SSE stream endpoint

tunnels:
  # Tunnels are managed via `workspace:manage_tunnels` OAuth, not API keys;
  # excluded from both official SDKs for the same reason.
  - op: GET /v1/tunnels?beta=true
    reason: OAuth-only surface
  - op: POST /v1/tunnels?beta=true
    reason: OAuth-only surface
  - op: GET /v1/tunnels/{tunnel_id}?beta=true
    reason: OAuth-only surface
  - op: POST /v1/tunnels/{tunnel_id}/archive?beta=true
    reason: OAuth-only surface
  - op: POST /v1/tunnels/{tunnel_id}/reveal_token?beta=true
    reason: OAuth-only surface
  - op: POST /v1/tunnels/{tunnel_id}/rotate_token?beta=true
    reason: OAuth-only surface
  - op: GET /v1/tunnels/{tunnel_id}/certificates?beta=true
    reason: OAuth-only surface
  - op: POST /v1/tunnels/{tunnel_id}/certificates?beta=true
    reason: OAuth-only surface
  - op: GET /v1/tunnels/{tunnel_id}/certificates/{certificate_id}?beta=true
    reason: OAuth-only surface
  - op: POST /v1/tunnels/{tunnel_id}/certificates/{certificate_id}/archive?beta=true
    reason: OAuth-only surface

beta_duplicates_of_ga:
  # Beta twins of GA messages/batches/models ops fold into the GA surface;
  # exposing both would double every signature in the resource.
  - op: POST /v1/messages?beta=true
    reason: beta duplicate of GA messages_post
  - op: POST /v1/messages/count_tokens?beta=true
    reason: beta duplicate of GA messages_count_tokens_post
  - op: GET /v1/messages/batches?beta=true
    reason: beta duplicate of GA message_batches_list
  - op: POST /v1/messages/batches?beta=true
    reason: beta duplicate of GA message_batches_post
  - op: GET /v1/messages/batches/{message_batch_id}?beta=true
    reason: beta duplicate of GA message_batches_retrieve
  - op: DELETE /v1/messages/batches/{message_batch_id}?beta=true
    reason: beta duplicate of GA message_batches_delete
  - op: POST /v1/messages/batches/{message_batch_id}/cancel?beta=true
    reason: beta duplicate of GA message_batches_cancel
  - op: GET /v1/messages/batches/{message_batch_id}/results?beta=true
    reason: beta duplicate of GA message_batches_results
  - op: GET /v1/models?beta=true
    reason: beta duplicate of GA models_list
  - op: GET /v1/models/{model_id}?beta=true
    reason: beta duplicate of GA models_get

hard_deprecated:
  # Endpoints the API rejects outright — mapped to `skip_this_resource` in the
  # CSV (verified live 2026-07-09: 400 "The /v1/complete endpoint has been
  # deprecated. Please use the /v1/messages endpoint instead.").
  - op: POST /v1/complete
    reason: hard-deprecated server-side (400 on every call)

beta_duplicates_of_ga_files_skills:
  # Files and skills went GA in the 2026-09 spec (non-beta `/v1/files` and
  # `/v1/skills` paths; the SDK exposes them as top-level resources without
  # a beta header - verified live 2026-09-15). The provider folds into the GA
  # ops (same resources/methods/verbs as before). The beta twins are excluded
  # like the beta twins of messages/batches/models. The one beta-only op
  # with no GA twin, `GET /v1/skills/{skill_id}/versions/{version}/content?beta=true`,
  # is KEPT (versions.download).
  - op: GET /v1/files?beta=true
    reason: beta duplicate of GA list_files_v1_files_get
  - op: POST /v1/files?beta=true
    reason: beta duplicate of GA upload_file_v1_files_post
  - op: GET /v1/files/{file_id}?beta=true
    reason: beta duplicate of GA get_file_metadata_v1_files__file_id__get
  - op: DELETE /v1/files/{file_id}?beta=true
    reason: beta duplicate of GA delete_file_v1_files__file_id__delete
  - op: GET /v1/files/{file_id}/content?beta=true
    reason: beta duplicate of GA download_file_v1_files__file_id__content_get
  - op: GET /v1/skills?beta=true
    reason: beta duplicate of GA list_skills_v1_skills_get
  - op: POST /v1/skills?beta=true
    reason: beta duplicate of GA create_skill_v1_skills_post
  - op: GET /v1/skills/{skill_id}?beta=true
    reason: beta duplicate of GA get_skill_v1_skills__skill_id__get
  - op: DELETE /v1/skills/{skill_id}?beta=true
    reason: beta duplicate of GA delete_skill_v1_skills__skill_id__delete
  - op: GET /v1/skills/{skill_id}/versions?beta=true
    reason: beta duplicate of GA list_skill_versions_v1_skills__skill_id__versions_get
  - op: POST /v1/skills/{skill_id}/versions?beta=true
    reason: beta duplicate of GA create_skill_version_v1_skills__skill_id__versions_post
  - op: GET /v1/skills/{skill_id}/versions/{version}?beta=true
    reason: beta duplicate of GA get_skill_version_v1_skills__skill_id__versions__version__get
  - op: DELETE /v1/skills/{skill_id}/versions/{version}?beta=true
    reason: beta duplicate of GA delete_skill_version_v1_skills__skill_id__versions__version__delete

# ---- Admin API (/v1/organizations/*) -----------------------------------------
# The 2026-09 bundled spec models the Admin API as beta-keyed paths (100 ops).
# Every one of them needs the org-scoped Admin key (sk-ant-admin01-...), which
# is disjoint from the workspace key this provider authenticates with, so none
# belong in `anthropic`. Grouped by what happens to them:
#   - admin_served_by_anthropic_admin: the 27 ops the docs-driven
#     anthropic_admin provider already ships (hand-authored source specs).
#   - admin_wif_oauth_only / admin_enterprise_key: excluded from BOTH
#     providers by policy (see CLAUDE.md, Taxonomies).
#   - admin_uncovered: candidates for a future anthropic_admin extension
#     (external keys, RBAC groups/roles, organization-level tunnels).

admin_served_by_anthropic_admin:
